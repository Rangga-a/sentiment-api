<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentimen Rupiah</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="card">

  <h1>Cek Sentimen Komentar</h1>
  <p class="subtitle">Masukkan komentar berbahasa Indonesia terkait rupiah.</p>

  <textarea id="text-input" placeholder="kebijakan pemerintah tidak bagus untuk rakyat"></textarea>
  <button id="submit-btn">Analisis</button>

  <p class="status" id="loading">Menganalisis…</p>
  <p class="status status--error" id="error"></p>

  <div class="result" id="result">
    <p class="result__line">
      <span id="label-text">Positif</span>
      <span id="pct-text">92.1%</span>
    </p>
    <p class="result__detail" id="score-detail"></p>
  </div>

  <hr>

  <div class="info-row"><span>Dataset</span><span id="info-dataset">—</span></div>
  <div class="info-row"><span>Model</span><span id="info-model">—</span></div>
  <div class="info-row"><span>Fitur</span><span id="info-features">—</span></div>
  <div class="info-row"><span>Akurasi</span><span id="info-accuracy">—</span></div>
  <p class="info-note" id="info-note"></p>

  <footer>
    <a href="https://github.com/Rangga-a" target="_blank" rel="noopener noreferrer">Rangga-a</a>
  </footer>

</main>

<script>
const SENT = {
  negative: { cls: 'down', id: 'Negatif' },
  neutral: { cls: 'flat', id: 'Netral' },
  positive: { cls: 'up', id: 'Positif' },
};
const ORDER = ['Negative', 'Neutral', 'Positive'];

const input = document.getElementById('text-input');
const btn = document.getElementById('submit-btn');
const loading = document.getElementById('loading');
const errorBox = document.getElementById('error');
const result = document.getElementById('result');
const labelEl = document.getElementById('label-text');
const pctEl = document.getElementById('pct-text');
const detailEl = document.getElementById('score-detail');

function sentMeta(label) {
  return SENT[label.toLowerCase()] || { cls: 'flat', id: label };
}

async function analyze() {
  const text = input.value.trim();
  errorBox.style.display = 'none';
  result.classList.remove('is-visible');

  if (!text) {
    errorBox.textContent = 'Teks tidak boleh kosong.';
    errorBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  loading.style.display = 'block';

  try {
    const res = await fetch('/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || 'Gagal menganalisis teks.');
    }

    renderResult(await res.json());
  } catch (e) {
    errorBox.textContent = e.message;
    errorBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    loading.style.display = 'none';
  }
}

function renderResult(data) {
  const meta = sentMeta(data.label);
  result.className = `result is-visible result--${meta.cls}`;
  labelEl.textContent = meta.id;
  pctEl.textContent = `${(data.confidence * 100).toFixed(1)}%`;

  const rest = Object.entries(data.all_scores)
    .filter(([cls]) => cls !== data.label)
    .sort((a, b) => ORDER.indexOf(a[0]) - ORDER.indexOf(b[0]))
    .map(([cls, score]) => `${sentMeta(cls).id} ${(score * 100).toFixed(0)}%`);

  detailEl.textContent = rest.join(' · ');
}

btn.addEventListener('click', analyze);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) analyze();
});

async function loadModelInfo() {
  const datasetEl = document.getElementById('info-dataset');
  const modelEl = document.getElementById('info-model');
  const featuresEl = document.getElementById('info-features');
  const accuracyEl = document.getElementById('info-accuracy');
  const noteEl = document.getElementById('info-note');

  try {
    const res = await fetch('/model-info');
    if (!res.ok) throw new Error();
    const data = await res.json();

    const ds = data.dataset;
    const feat = data.features;
    const acc = data.metrics && typeof data.metrics.accuracy === 'number'
      ? `${(data.metrics.accuracy * 100).toFixed(1)}%`
      : '—';

    modelEl.textContent = data.model_name || '—';
    datasetEl.textContent = ds ? `${ds.total_comments ?? '?'} komentar` : '—';
    featuresEl.textContent = feat ? feat.method : '—';
    accuracyEl.textContent = acc;
    noteEl.textContent = ds ? 'Label otomatis dari model pretrained, bukan anotasi manual.' : '';
  } catch (e) {
    [datasetEl, modelEl, featuresEl, accuracyEl].forEach((el) => { el.textContent = '—'; });
  }
}

loadModelInfo();
</script>
</body>
</html>
